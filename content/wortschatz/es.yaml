# Español → Deutsch
#
# One entry per list item. Fields:
#   term     (required) the Spanish word or phrase
#   de       (required) what it means in German
#   type     (required) word | phrase | question | sentence
#   tags     (required) one or more of: common, funny, kind, proverb, rude, vulgar, thing; new tags are allowed
#   literal  (optional) word-for-word German, when it differs from the meaning
#   note     (optional) when and how it is used
#   example  (optional) { term: Spanish sentence, de: German sentence }
#
# Add new entries at the end. `bun run check:data` validates this file.

language: Español
flag: 🇪🇸

entries:
  - term: Eso es muy bonito, ¡yo también me alegro por ti! / Muy amable, ¡yo también!
