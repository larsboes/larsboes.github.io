# Österreichisch → Hochdeutsch
#
# Same fields as es.yaml; see the comment at the top of that file.
# Add a new entry at the end of its priority section. `bun run check:data` validates this file.

language: Österreichisch
flag: 🇦🇹
target: Hochdeutsch
speech: de-AT
links:
  - label: ostarrichi.org, Österreichisches Wörterbuch
    url: https://www.ostarrichi.org/

entries:

  # ── Priority 1

  - term: Oida
    de: Alter
    type: word
    tags: [common]
    priority: 1
    note: Anrede und Ausruf für alles, von Überraschung bis Ärger.

  - term: Ur
    de: Sehr / total
    type: word
    tags: [common]
    priority: 1
    note: Steht vor dem Adjektiv.
    example:
      term: Des is ur zach.
      de: Das ist total mühsam.

  - term: Zach
    de: Mühsam / anstrengend
    literal: Zäh
    type: word
    tags: [common]
    priority: 1

  - term: Schiach / Schiech
    de: Hässlich
    type: word
    tags: [common]
    priority: 1

  - term: Leiwand
    de: Toll / super
    type: word
    tags: [common]
    priority: 1

  - term: Heast!
    de: Hey! / Hör mal!
    literal: Hörst du!
    type: word
    tags: [common]
    priority: 1

  - term: Geh bitte! / Na geh!
    de: Ach komm!
    type: phrase
    tags: [common]
    priority: 1

  - term: Eh
    de: Sowieso
    type: word
    tags: [common]
    priority: 1
    example:
      term: Passt eh.
      de: Passt sowieso.

  - term: Gemma!
    de: Gehen wir!
    type: word
    tags: [common]
    priority: 1

  - term: Baba! / Servus!
    de: Tschüss! / Hallo!
    type: word
    tags: [common]
    priority: 1
    note: Servus geht für Hallo und Tschüss, Baba nur zum Abschied.

  - term: Bist du deppert!
    de: Bist du verrückt!
    type: phrase
    tags: [funny, rude]
    priority: 1

  - term: Grantig
    de: Schlecht gelaunt
    type: word
    tags: [common]
    priority: 1

  - term: Sudern
    de: Jammern
    type: word
    tags: [common]
    priority: 1

  - term: Schmäh
    de: Witz, Charme
    type: word
    tags: [common, funny]
    priority: 1
    example:
      term: Der hat an Schmäh.
      de: Der ist witzig und charmant.

